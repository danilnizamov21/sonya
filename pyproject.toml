[project]
name = "sonya"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Danil Nizamov", email = "1evsha3243@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "beautifulsoup4>=4.15.0",
    "camoufox>=0.4.11",
    "httpx>=0.28.1",
    "playwright>=1.63.0",
    "playwright-stealth>=2.0.3",
    "psycopg[binary]>=3.3.6",
    "psycopg2-binary>=2.9.13",
    "pytest-playwright>=0.9.0",
    "sqlalchemy>=2.1.3",
    "pymorphy3>=2.0.6",
    "typer[all]>=0.27.3",
    "fastapi[standard]>=0.146.0",
    "python-multipart>=0.0.32",
    "pika>=1.4.4",
]

[project.scripts]
sonya = "sonya.cli:app"

[build-system]
requires = ["uv_build>=0.12.16,<0.13.0"]
build-backend = "uv_build"
